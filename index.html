<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pressure control valves: animated cross-sections</title>
<meta name="description" content="Interactive cross-section animations of hydraulic pressure control valves, with agricultural applications, calculators and quizzes for teaching.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=STIX+Two+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E9EC; --panel:#F6F7F8; --ink:#1C232B; --muted:#56616D; --line:#C5CCD3;
  --steel:#A5AEB7; --steel-dark:#66717C; --steel-light:#D3D8DD; --hatch:#7D8893; --rod:#C9D0D6; --rod-hi:#F1F4F6;
  --hp:#C62E2E; --lp:#2563A8; --pilot:#D9822B; --met:#C9A227; --drain:#2F8F5B; --spring:#7A5AA6; --accent:#F2C230;
  --edge:var(--steel-dark); --pipe:var(--steel);
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --math:"STIX Two Text","Times New Roman",Times,serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151A1F; --panel:#1E252C; --ink:#E3E8EC; --muted:#9BA7B3; --line:#34404B;
    --steel:#5B6772; --steel-dark:#3B4550; --steel-light:#7A8792; --hatch:#45515C; --rod:#8E99A3; --rod-hi:#C3CBD2;
    --hp:#E25858; --lp:#5C98E2; --pilot:#F0A04B; --met:#E2C04E; --drain:#55C08A; --spring:#A98AD8; --accent:#F2C230;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151A1F; --panel:#1E252C; --ink:#E3E8EC; --muted:#9BA7B3; --line:#34404B;
  --steel:#5B6772; --steel-dark:#3B4550; --steel-light:#7A8792; --hatch:#45515C; --rod:#8E99A3; --rod-hi:#C3CBD2;
  --hp:#E25858; --lp:#5C98E2; --pilot:#F0A04B; --met:#E2C04E; --drain:#55C08A; --spring:#A98AD8; --accent:#F2C230;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
.wrap{max-width:1360px;margin:0 auto;padding:24px 20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 28px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
h1{font-family:var(--cond);font-weight:600;font-size:clamp(1.9rem,4.2vw,3rem);line-height:1;margin:0}
header.top>div:first-child{flex:1 1 420px}
.sub{margin:4px 0 0;color:var(--muted)}
.topctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--steel-dark);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:500 .9rem var(--sans);padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--steel-dark)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
nav.types{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;position:sticky;top:12px}
nav.types h2{font-family:var(--cond);font-size:1.1rem;margin:2px 6px 8px;color:var(--muted);font-weight:600}
nav.types ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
nav.types li.sep{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
@media (max-width:900px){nav.types{position:static} nav.types ul{flex-direction:row;overflow-x:auto;padding-bottom:4px} nav.types li{flex:0 0 auto} nav.types li.sep{border-top:0;margin:0;padding:0;border-left:1px solid var(--line);padding-left:4px}}
.typebtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);font:500 .95rem var(--sans);padding:6px 8px;border-radius:4px;cursor:pointer}
.typebtn:hover{background:var(--bg)}
.typebtn[aria-current="page"]{background:var(--ink);color:var(--panel)}
.typebtn svg{width:46px;height:24px;flex:0 0 auto}
.typebtn svg *{stroke:currentColor;fill:none;stroke-width:5}
.typebtn svg text{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.figtop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.figtop h2{font-family:var(--cond);font-weight:600;font-size:1.7rem;margin:0}
.state{font:600 1rem var(--cond);display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.state i{width:10px;height:10px;border-radius:50%;background:var(--steel)}
.state[data-k="open"] i{background:var(--drain)} .state[data-k="partial"] i{background:var(--pilot)} .state[data-k="reverse"] i{background:var(--lp)}
.stage{overflow-x:auto}
.stage svg{display:block;width:100%;height:auto;max-height:62vh;min-width:420px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 2px 0;font-size:.86rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:10px 2px 0}
.btn{border:1px solid var(--steel-dark);background:var(--bg);color:var(--ink);font:500 .9rem var(--sans);padding:6px 11px;border-radius:4px;cursor:pointer}
.btn:hover{background:var(--steel-light)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.btn:disabled{opacity:.45;cursor:default}
.toolbar label{font-size:.9rem;display:flex;align-items:center;gap:6px}
.rng{position:relative;display:inline-flex}
.rng input{width:200px}
.rng .mk{position:absolute;top:-5px;width:2px;height:8px;background:var(--hp);transform:translateX(-1px);pointer-events:none}
.toolbar output{font:600 1rem var(--cond);min-width:64px;font-variant-numeric:tabular-nums}
.toolbar label.off{opacity:.45}
input[type=range]{accent-color:var(--ink)}
select{font:500 .9rem var(--sans);padding:5px;border-radius:4px;border:1px solid var(--steel-dark);background:var(--bg);color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{margin:12px 2px 0;padding:10px 12px;border-left:5px solid var(--hp);background:var(--bg);min-height:3.2em}
.readings{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:14px;margin-top:12px;align-items:stretch}
@media (max-width:700px){.readings{grid-template-columns:minmax(0,1fr)}}
.gauges{display:flex;gap:10px}
.gauge{background:var(--bg);border-radius:4px;padding:6px 10px 8px;text-align:center;min-width:132px}
.gauge svg{width:118px;display:block;margin:0 auto}
.gtrack{fill:none;stroke:var(--line);stroke-width:8}
.gfill{fill:none;stroke-width:8}
.gneedle{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round} .ghub{fill:var(--ink)} .gset{stroke:var(--ink);stroke-width:2}
.gval{font:600 1.35rem var(--cond);line-height:1;font-variant-numeric:tabular-nums}
.gval small{font-size:.85rem;color:var(--muted);font-weight:500}
.glab{font-size:.8rem;color:var(--muted);line-height:1.2;margin-top:2px}
.trace{background:var(--bg);border-radius:4px;padding:6px 10px}
.trace .th{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.trace .th span{display:inline-flex;align-items:center;gap:5px;margin-left:10px}
.trace .th i{width:14px;height:3px;border-radius:2px;display:inline-block}
.trace svg{display:block;width:100%;height:96px;margin-top:4px}
.tgrid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.tset{stroke:var(--muted);stroke-width:1;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.tline{fill:none;stroke-width:2.2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.below{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:1100px){.below{grid-template-columns:minmax(0,1fr)}}
.card h3{font-family:var(--cond);font-weight:600;font-size:1.3rem;margin:0 0 6px}
.card h4{margin:12px 0 4px;font-size:.95rem}
.card p{margin:0 0 6px}
.card ol{margin:0;padding-left:20px} .card ol li{margin:4px 0}
.howsteps li{transition:color .3s}
.howsteps.live li{color:var(--muted)}
.howsteps.live li.on{color:var(--ink);font-weight:500}
.howsteps li.hid{display:none}
.symbol{display:flex;justify-content:center;background:var(--bg);border-radius:4px;padding:8px;margin-top:8px}
.symbol svg{width:100%;max-width:260px;height:auto}
.symbol svg .dsh{stroke-dasharray:5 4}
.note{font-size:.88rem;color:var(--muted);margin-top:8px}
.mt{margin-top:16px}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:6px}
.appx{background:var(--bg);border-radius:4px;padding:10px 12px;border-top:3px solid var(--ink)}
.appx .m{font-size:.82rem;color:var(--muted);margin:0}
.appx h4{margin:2px 0 4px;font-size:1.05rem;font-family:var(--cond);font-weight:600}
.appx p{font-size:.93rem}
.appx .typ{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.appx .typ b{color:var(--ink);font-weight:600}
.disc{margin-top:12px;padding:10px 12px;border-left:5px solid var(--accent);background:var(--bg)}
.disc b{font-family:var(--cond);font-weight:600;font-size:1.05rem;display:block}
.calcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px;margin:6px 0 12px}
.calcgrid label{display:flex;flex-direction:column;font-size:.88rem;color:var(--muted)}
.calcgrid .in{display:flex;align-items:center;gap:6px}
.calcgrid input{width:110px;font:600 1rem var(--cond);padding:3px 6px;border:1px solid var(--steel-dark);border-radius:3px;background:var(--bg);color:var(--ink);text-align:right}
.calcgrid .u{color:var(--muted);font-size:.85rem}
.tablewrap{overflow-x:auto}
table.calc{border-collapse:collapse;width:100%;font-size:.92rem;min-width:620px}
table.calc th,table.calc td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.calc th{color:var(--muted);font-weight:600}
table.calc td.eq{font-family:var(--math);font-size:1.05rem;font-style:italic;white-space:nowrap}
table.calc td.sub{font-family:var(--math);color:var(--muted)}
table.calc td.res b{font-weight:600}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.qmeta{color:var(--muted);font-size:.88rem;margin:0}
.qq{padding:12px 0;border-bottom:1px solid var(--line)}
.qt{margin:0 0 8px;font-weight:500}
.qt b{font-family:var(--cond);font-weight:600;margin-right:6px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (max-width:640px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{border:1px solid var(--steel-dark);background:var(--bg);color:var(--ink);font:400 .93rem var(--sans);padding:7px 10px;border-radius:4px;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){background:var(--steel-light)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--drain);box-shadow:inset 4px 0 0 var(--drain)}
.opt.no{border-color:var(--hp);box-shadow:inset 4px 0 0 var(--hp)}
.qq.done .opt:not(.ok):not(.no){opacity:.5}
.why{margin:8px 0 0;padding:8px 10px;border-left:5px solid var(--steel-dark);background:var(--bg);font-size:.92rem}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.qres{margin:0}
footer{margin-top:30px;font-size:.85rem;color:var(--muted)}
.keys{font-size:.82rem;color:var(--muted)}
kbd{font:600 .78rem var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel)}
/* 2D section drawing, same conventions as the cylinder site */
.hatch-bg{fill:var(--steel-light)} .hatch-line{stroke:var(--hatch);stroke-width:1.1}
.bd{fill:url(#hatch);stroke:var(--steel-dark);stroke-width:1.2}
.stl{stroke:var(--steel-dark);stroke-width:1.1}
.spB{fill:none;stroke:var(--spring);stroke-opacity:.5;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.spF{fill:none;stroke:var(--spring);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.spH{fill:none;stroke:#fff;stroke-opacity:.35;stroke-width:1;stroke-linecap:round}
.fp{fill:none;stroke:none}
.stream{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.pt0{stroke:rgba(0,0,0,.22);stroke-width:4.2;stroke-linecap:round}
.pt1{stroke:#fff;stroke-opacity:.9;stroke-width:2.4;stroke-linecap:round}
.lbl text{font:600 13px var(--cond);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.lbl path{fill:none;stroke:var(--muted);stroke-width:1}
.lbl circle{display:none}
.nolabels .lbl{display:none}
.ltxt{font:600 12px var(--cond);fill:#fff;text-anchor:middle}
/* lecture mode */
.presenter{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--panel);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.presenter .pname{font:600 1.15rem var(--cond);margin:0 6px}
.presenter .pg{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.presenter button{border:1px solid var(--steel);background:transparent;color:var(--panel);font:500 .9rem var(--sans);padding:5px 10px;border-radius:4px;cursor:pointer}
body.lecture .presenter{display:flex}
body.lecture header.top,body.lecture nav.types{display:none}
body.lecture .layout{grid-template-columns:minmax(0,1fr)}
body.lecture .wrap{max-width:1700px;padding-bottom:90px}
body.lecture .stage svg{max-height:70vh}
body.lecture .status{font-size:1.2rem}
body.lecture .howsteps li{font-size:1.2rem}
body.lecture .card p,body.lecture .appx p{font-size:1.08rem}
body.lecture .qt{font-size:1.15rem}
.nextpt{display:none;margin-top:8px}
body.lecture .nextpt{display:inline-block}
@media (prefers-reduced-motion: reduce){.howsteps li{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="hatch-bg" width="7" height="7"/><line class="hatch-line" x1="0" y1="0" x2="0" y2="7"/></pattern>
  <linearGradient id="steelV" x1="0" x2="1"><stop offset="0" stop-color="#66717C"/><stop offset=".3" stop-color="#C9D0D6"/><stop offset=".5" stop-color="#F1F4F6"/><stop offset=".75" stop-color="#A5AEB7"/><stop offset="1" stop-color="#66717C"/></linearGradient>
  <linearGradient id="steelH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#66717C"/><stop offset=".3" stop-color="#C9D0D6"/><stop offset=".5" stop-color="#F1F4F6"/><stop offset=".75" stop-color="#A5AEB7"/><stop offset="1" stop-color="#66717C"/></linearGradient>
  <linearGradient id="bronzeV" x1="0" x2="1"><stop offset="0" stop-color="#525c66"/><stop offset=".3" stop-color="#aab3bc"/><stop offset=".5" stop-color="#e3e8ec"/><stop offset=".75" stop-color="#8d97a1"/><stop offset="1" stop-color="#4f5963"/></linearGradient>
  <linearGradient id="bronzeH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#525c66"/><stop offset=".3" stop-color="#aab3bc"/><stop offset=".5" stop-color="#e3e8ec"/><stop offset=".75" stop-color="#8d97a1"/><stop offset="1" stop-color="#4f5963"/></linearGradient>
  <radialGradient id="ballG" cx=".35" cy=".32" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#C9D0D6"/><stop offset="1" stop-color="#66717C"/></radialGradient>
  <linearGradient id="knobG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f45"/><stop offset=".4" stop-color="#1c1f22"/><stop offset="1" stop-color="#08090a"/></linearGradient>
</defs></svg>
<div class="wrap">
<header class="top">
  <div>
    <h1>Pressure control valves</h1>
    <p class="sub">Choose a valve, watch it work in cross-section, then see where it is used on farm machinery, size it and test yourself.</p>
  </div>
  <div class="topctl">
    <button class="btn" id="lectureBtn" aria-pressed="false">Lecture mode</button>
    <div class="seg" role="group" aria-label="Units"><button data-units="si" aria-pressed="true">SI (metric)</button><button data-units="us" aria-pressed="false">US customary</button></div>
  </div>
</header>
<div class="layout">
  <nav class="types" aria-label="Valve types">
    <h2>Valve types</h2>
    <ul id="typeList"></ul>
  </nav>
  <main id="view"></main>
</div>
</div>
<div class="presenter" role="toolbar" aria-label="Presenter controls"><div class="pg"><button data-p-act="prev">Previous</button><span class="pname"></span><button data-p-act="next">Next</button></div><div class="pg"><button data-p-act="pt">Next point</button><button data-p-act="fs">Full screen</button><button data-p-act="exit">Exit lecture</button></div></div>
<script>
(function(){
"use strict";
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ramp=(v,a,b)=>clamp((v-a)/(b-a));
const ease=(c,t,dt,k=7)=>c+(t-c)*Math.min(1,dt*k);
function phys(o,key,target,dt,k=150,c=17,lo=0,hi=1){const x=o[key]||0,v=o[key+'_v']||0;let a=k*(target-x)-c*v;let nv=v+a*dt,nx=x+nv*dt;if(nx<lo){nx=lo;nv=0;}if(nx>hi){nx=hi;nv=0;}o[key]=nx;o[key+'_v']=nv;return nx;}
/* oil colours come from the CSS tokens, so light and dark mode both work */
let ROLE={},PALE=[246,247,248];
function hex(v){v=v.trim();if(v[0]==='#'){if(v.length===4)v='#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];return [1,3,5].map(i=>parseInt(v.slice(i,i+2),16));}const m=v.match(/\d+/g);return m?m.slice(0,3).map(Number):[128,128,128];}
function readColors(){const cs=getComputedStyle(document.documentElement);const g=n=>hex(cs.getPropertyValue(n));ROLE={P:g('--hp'),pilot:g('--pilot'),met:g('--met'),T:g('--lp'),D:g('--drain')};PALE=g('--panel');}
readColors();window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();});
function roleColor(role,q){const d=ROLE[role]||ROLE.P;const t=0.12+0.5*Math.pow(clamp(q),0.75);return d.map((c,i)=>PALE[i]+(c-PALE[i])*t);}
function streamColor(role){const d=ROLE[role]||ROLE.P;return d.map((c,i)=>PALE[i]+(c-PALE[i])*0.82);}
/* ---------- drawing helpers ---------- */
function helix(cx,a1,a2,r,n,horiz){const steps=Math.max(8,Math.round(n*20));let back='',front='',pf=false,px=0,py=0;
  for(let i=0;i<=steps;i++){const t=i/steps,th=2*Math.PI*n*t;const along=a1+(a2-a1)*t,across=r*Math.sin(th),depth=Math.cos(th),pz=r*0.24*depth;
    const X=horiz?along+pz:cx+across,Y=horiz?cx+across:along+pz;const s=X.toFixed(1)+' '+Y.toFixed(1);
    back+=(i?'L':'M')+s;const f=depth>0;if(f)front+=(pf?'L':'M'+(i?px.toFixed(1)+' '+py.toFixed(1)+'L':''))+s;pf=f;px=X;py=Y;}
  return [back,front];}
function spr(n,args){const [b,f]=helix(...args);return `<path data-s="${n}" data-w="b" class="spB" d="${b}"/><path data-s="${n}" data-w="f" class="spF" d="${f}"/><path data-s="${n}" data-w="f" class="spH" d="${f}"/>`;}
const bd=(x,y,w,h,rx=0)=>`<rect class="bd" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`;
const Z=(p,z,x,y,w,h)=>`<rect ${p?`data-p="${p}" `:''}data-z="${z}" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
const F=(n,d,w)=>`<path data-f="${n}" class="fp" d="${d}"${w?` data-sw="${w}"`:''}/>`;
function zpipe(z,d,w){return `<path d="${d}" fill="none" stroke="var(--edge)" stroke-width="${w+9}" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="var(--pipe)" stroke-width="${w+5}" stroke-linejoin="round"/><path data-z="${z}" data-zs="1" d="${d}" fill="none" stroke-width="${w}" stroke-linejoin="round"/>`;}
function knob(x,y,w,h){let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="url(#knobG)" stroke="#000"/>`;for(let i=x+5;i<x+w-3;i+=5)s+=`<line x1="${i}" y1="${y+3}" x2="${i}" y2="${y+h-3}" stroke="#4a4f55" stroke-width="1.2"/>`;return s;}
function knobH(x,y,w,h){let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="url(#knobG)" stroke="#000"/>`;for(let i=y+5;i<y+h-3;i+=5)s+=`<line x1="${x+3}" y1="${i}" x2="${x+w-3}" y2="${i}" stroke="#4a4f55" stroke-width="1.2"/>`;return s;}
function screw(x,y,w,h,horiz){let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${horiz?'steelH':'steelV'})" class="stl"/>`;if(horiz){for(let i=x+3;i<x+w;i+=4)s+=`<line x1="${i}" y1="${y}" x2="${i+2}" y2="${y+h}" stroke="#5d6670" stroke-width=".9"/>`;}else{for(let i=y+3;i<y+h;i+=4)s+=`<line x1="${x}" y1="${i}" x2="${x+w}" y2="${i+2}" stroke="#5d6670" stroke-width=".9"/>`;}return s;}
const nut=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="url(#steelV)" class="stl"/><line x1="${x+w/3}" y1="${y}" x2="${x+w/3}" y2="${y+h}" stroke="var(--edge)"/><line x1="${x+2*w/3}" y1="${y}" x2="${x+2*w/3}" y2="${y+h}" stroke="var(--edge)"/>`;
const plate=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="url(#steelH)" class="stl"/>`;
function L(text,x,y,anchor,line){const t=`<text x="${x}" y="${y}" text-anchor="${anchor||'start'}">`+text.split('\n').map((l,i)=>`<tspan x="${x}" dy="${i?14:0}">${l}</tspan>`).join('')+`</text>`;return `<g class="lbl">${line?`<path d="M${line[0]} ${line[1]} L${line[2]} ${line[3]}"/><circle cx="${line[2]}" cy="${line[3]}" r="2.4"/>`:''}${t}</g>`;}
/* schematic */
const sDot=(x,y)=>`<circle cx="${x}" cy="${y}" r="3.5" fill="currentColor" stroke="none"/>`;
const sTank=(x,y)=>`<path d="M${x-11} ${y} V${y+10} H${x+11} V${y}"/>`;
function sArrow(n,x1,x2,y,off){return `<g data-p="${n}" transform="translate(0 ${off})"><line x1="${x1}" y1="${y}" x2="${x2-6}" y2="${y}"/><path d="M${x2} ${y} l-10 -5 v10z" fill="currentColor" stroke="none"/></g>`;}
function sSpring(x,yb,adj){let s=`<path d="M${x} ${yb} L${x-12} ${yb-4} L${x+12} ${yb-10} L${x-12} ${yb-16} L${x+12} ${yb-22} L${x-12} ${yb-28}"/>`;if(adj)s+=`<line x1="${x-18}" y1="${yb-2}" x2="${x+14}" y2="${yb-28}"/><path d="M0 0 l-9 -4.5 v9z" transform="translate(${x+16} ${yb-30}) rotate(-39)" fill="currentColor" stroke="none"/>`;return s;}
const symWrap=(vb,inner)=>`<svg viewBox="${vb}" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="ISO schematic symbol">${inner}</svg>`;
const sText=(x,y,t)=>`<text x="${x}" y="${y}" fill="currentColor" stroke="none" font-size="12.5" font-weight="600" font-family="Archivo, Arial, sans-serif">${t}</text>`;

/* ---------- shared spool body (sequence / counterbalance / unloading) ---------- */
function spoolBody(o){
  let s=bd(150,60,260,350,10);
  s+=Z('sprch','drain',245,80,60,90)+Z('mid','in',245,222,60,78)+Z('pch','pilot',245,340,60,25);
  s+=Z(null,'in',150,235,96,40)+Z(null,'out',304,175,106,40);
  s+= o.drain==='ext'?Z(null,'drain',150,95,96,15):Z(null,'drain',304,95,36,15)+Z(null,'drain',326,108,14,68);
  s+= o.pilot==='in'?Z(null,'pilot',195,274,14,92)+Z(null,'pilot',195,352,51,14):Z(null,'pilot',150,352,96,14);
  if(o.check){s+=Z(null,'out',366,214,28,78)+Z(null,'in',366,292,28,107)+Z(null,'in',160,385,234,14)+Z(null,'in',160,274,14,125);}
  s+=F('fwd','M152 255 H262 Q275 255 275 240 V210 Q275 195 290 195 H408');
  if(o.check)s+=F('rev','M408 195 H372 Q380 195 380 210 V378 Q380 392 366 392 H180 Q167 392 167 378 V268 Q167 255 155 255',12);
  if(o.check){s+=`<rect x="366" y="288" width="8" height="9" class="bd"/><rect x="386" y="288" width="8" height="9" class="bd"/>`+spr('cspring',[380,316,382,7,4,false])+`<circle data-p="ball" cx="380" cy="306" r="10" fill="url(#ballG)" stroke="var(--edge)"/>`;}
  s+=plate(250,86,50,6)+spr('spring',[275,92,170,21,5,false]);
  s+=screw(270,12,10,76)+nut(257,44,36,16)+knob(238,2,74,22);
  s+=`<g data-p="spool"><rect x="246" y="170" width="58" height="52" rx="3" fill="url(#steelV)" class="stl"/><rect x="266" y="222" width="18" height="78" fill="url(#steelV)" class="stl"/><rect x="246" y="300" width="58" height="40" rx="3" fill="url(#steelV)" class="stl"/><line x1="246" y1="186" x2="304" y2="186" stroke="var(--edge)" stroke-width=".8" opacity=".6"/><line x1="246" y1="324" x2="304" y2="324" stroke="var(--edge)" stroke-width=".8" opacity=".6"/></g>`;
  return s;
}
function applySpool(c,s,chk){
  c.attr('sprch',{height:Math.max(0,90-s)});c.attr('mid',{y:222-s});c.attr('pch',{y:340-s,height:25+s});
  c.tr('spool',0,-s);c.spring('spring',[275,92,170-s,21,5,false]);
  if(chk!=null){const cy=306+chk*18;c.attr('ball',{cy});c.spring('cspring',[380,cy+10,382,7,4,false]);}
}
function seqSymbol(drain){return symWrap('0 0 280 190',`<line x1="10" y1="90" x2="110" y2="90"/><rect x="110" y="60" width="70" height="60"/><line x1="180" y1="90" x2="270" y2="90"/>`+sDot(40,90)+sDot(64,90)+sDot(232,90)+`<path class="dsh" d="M64 90 V140 H124 V120"/>`+sSpring(145,60,true)+(drain?`<path class="dsh" d="M157 34 H200 V46"/>`+sTank(200,46):'')+`<path d="M40 90 V165 H118 M232 90 V165 H152 M152 165 L132 152 M152 165 L132 178"/><g data-p="sball"><circle cx="131" cy="165" r="10"/></g>`+sArrow('sarrow',118,172,90,18));}

const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};

    compute(v,H){const A=area(v.d),x=v.x+v.n*v.pt,pc=v.k*x/A,pf=v.k*(x+v.h)/A,P=pf*v.q;return [

      {label:'Spring compression',eq:'x = x<sub>0</sub> + n·pitch',sub:`${H.n(v.x,'len')} + ${fmt(v.n,2)} × ${H.n(v.pt,'len')}`,res:H.r(x,'len')},
      {label:'Cracking pressure',eq:'p<sub>c</sub> = k·x / A',sub:`${H.n(v.k,'k')} × ${H.n(x,'len')} / ${H.n(A,'area')}`,res:H.r(pc,'p')},
      {label:'Full-flow pressure',eq:'p<sub>f</sub> = k·(x + h) / A',sub:`${H.n(v.k,'k')} × (${H.n(x,'len')} + ${H.n(v.h,'len')}) / ${H.n(A,'area')}`,res:H.r(pf,'p')},
      {label:'Pressure override',eq:'Δp = p<sub>f</sub> − p<sub>c</sub>',sub:`${H.n(pf,'p')} − ${H.n(pc,'p')}`,res:`${H.r(pf-pc,'p')} (${fmt((pf-pc)/pc*100,1)}%)`},
      {label:'Heat when relieving',eq:'P = p<sub>f</sub>·Q',sub:`${H.n(pf,'p')} × ${H.n(v.q,'Q')}`,res:H.r(P,'pow')}];}},
  quiz:[
    {q:'What is the main job of a relief valve?',o:['Limit the maximum pressure in the system','Reduce pressure to one branch','Set the order of actuators','Hold a load in place'],a:0,why:'It opens to tank when inlet pressure reaches its setting.'},
    {q:'What is pressure override?',o:['Full-flow pressure minus cracking pressure','Relief setting minus pump pressure','Inlet minus tank pressure','The pressure needed to move a spool'],a:0,why:'Passing more flow needs more lift and more spring compression, so pressure climbs above the cracking point.'},
    {q:'Turning the adjustment screw in (compressing the spring) will…',o:['Raise the relief setting','Lower the relief setting','Raise pump flow','Have no effect'],a:0,why:'More spring force needs more pressure to lift the poppet.'},
    {q:'A 45 L/min (12 gpm) pump relieves at 172 bar (2,500 psi). About how much power becomes heat?',o:['About 13 kW (17.5 hp)','About 6.5 kW (8.7 hp)','About 26 kW (35 hp)','About 1.9 kW (2.5 hp)'],a:0,why:'P = p·Q: 2,500 × 12 ÷ 1,714 ≈ 17.5 hp ≈ 13 kW.'},
    {q:'Compared with pilot-operated reliefs, direct-acting reliefs are known for…',o:['Fast response but a larger pressure override','Very low override at high flow','Needing a remote pilot line','Being normally open'],a:0,why:'One spring does all the work, so they react fast but pressure rises with flow.'}]},
sequence:{
  summary:'A sequence valve makes one actuator finish before the next one starts. It stays closed until pressure in the primary circuit reaches its setting, then opens a path to the secondary circuit.',
  points:['The primary actuator moves at low pressure while the valve stays closed.','When the primary stops, pressure rises to the setting and lifts the spool.','Oil flows to the secondary actuator while the primary stays pressurized.','On the way back, oil returns through the bypass check, not the spool.'],
  uses:'Lift-then-fold on folding planters and cultivators, clamp-then-lift on bale handlers, grip-then-cut on grapple saws.',
  watch:'The outlet is pressurized, so the spring chamber needs an external drain. A setting too close to the working pressure lets the second actuator start early.',
  apps:[
    {m:'Folding planters and cultivators',t:'Lift, then fold',d:'The toolbar lift cylinders run first. Only when they reach the end of stroke does the sequence valve open to the wing-fold cylinders, so wings never fold while the openers are in the ground.',n:'Setting about 7–14 bar (100–200 psi) above lift pressure'},
    {m:'Bale handlers and squeezes',t:'Clamp, then lift',d:'The squeeze arms grip the bale first. Once clamping pressure is reached, the sequence valve lets the lift circuit start, so the bale is not dropped.',n:'The setting fixes the minimum clamp force'},
    {m:'Woodlot grapple saws',t:'Grip the log before cutting',d:'The grapple closes and builds pressure before the saw bar feeds, keeping the log from rolling during the cut.',n:'Set below the circuit relief'}],
  disc:'On a folding planter the wings start folding before the toolbar has fully lifted. Name two possible causes involving the sequence valve.',
  calc:{inputs:[['D','Primary bore D','len',0.08],['F','Load on primary','F',30000],['m','Safety margin','p',1.4e6],['r','Relief setting','p',1.7e7]],
    compute(v,H){const A=area(v.D),pw=v.F/A,ps=pw+v.m,ok=ps<=v.r-v.m;return [
      {label:'Primary bore area',eq:'A = π·D² / 4',sub:`π × ${H.n(v.D,'len')}² / 4`,res:H.r(A,'area')},
      {label:'Pressure to move the primary',eq:'p<sub>w</sub> = F / A',sub:`${H.n(v.F,'F')} / ${H.n(A,'area')}`,res:H.r(pw,'p')},
      {label:'Sequence setting',eq:'p<sub>s</sub> = p<sub>w</sub> + margin',sub:`${H.n(pw,'p')} + ${H.n(v.m,'p')}`,res:H.r(ps,'p')},
      {label:'Holding force on the primary',eq:'F<sub>h</sub> = p<sub>s</sub>·A',sub:`${H.n(ps,'p')} × ${H.n(A,'area')}`,res:H.r(ps*A,'F')},
      {label:'Check against relief',eq:'p<sub>s</sub> ≤ p<sub>relief</sub> − margin',sub:`${H.n(ps,'p')} ≤ ${H.n(v.r-v.m,'p')}`,res:ok?'<b>OK</b>':'<b>Too close</b>: raise the relief or lighten the load'}];}},
  quiz:[
    {q:'What does a sequence valve control?',o:['The order in which actuators operate','The maximum system pressure','Cylinder speed','Flow direction to tank'],a:0,why:'It opens to the secondary circuit only once the primary reaches the set pressure.'},
    {q:'Why does a sequence valve need an external drain?',o:['Its outlet is pressurized, so the spring chamber cannot drain there','To cool the spring','To raise its setting','Because it is normally open'],a:0,why:'Draining into the pressurized outlet would add outlet pressure to the spring and shift the setting.'},
    {q:'On a folding planter, a sequence valve usually makes sure that…',o:['The toolbar is raised before the wings fold','Seed depth stays constant','Seed rate stays constant','The wings fold faster'],a:0,why:'Folding with openers in the ground would damage the row units.'},
    {q:'How does return flow get back past a sequence valve?',o:['Through the internal bypass check','Through the external drain','Through the spool after it opens','It cannot return'],a:0,why:'The bypass check opens in reverse so the spool can stay closed.'},
    {q:'Where should the sequence setting sit?',o:['Above the primary’s working pressure and below the relief setting','Above the relief setting','Below the working pressure','At tank pressure'],a:0,why:'Too low and it switches early; above the relief it would never open.'}]},
counterbalance:{
  summary:'A counterbalance valve holds a raised load and only lets it come down under control. It is set above the pressure the load creates, so the load alone cannot open it.',
  points:['Load pressure stays below the setting, so the spool stays closed and the load is held.','To lower, the pump adds pressure on the rod side; the spool cracks open and meters oil out.','To raise, oil flows freely in through the bypass check.','Mounted on the cylinder, it also holds the load if a hose bursts.'],
  uses:'Boom lift and telescope on farm telehandlers, timber and loader cranes, and winch motors with overrunning loads.',
  watch:'Too low a setting lets the load creep or run away. Too high a setting wastes pump pressure and heats the oil every time the load is lowered.',
  apps:[
    {m:'Farm telehandlers',t:'Boom lift and telescope',d:'Counterbalance valves on the lift and telescope cylinders hold the boom when the joystick is released and give smooth lowering with a heavy bale or pallet. If a hose bursts, the load stays up.',n:'Setting about 1.3 × the highest load pressure'},
    {m:'Timber and loader cranes',t:'Crane boom and jib',d:'Each crane function lowers against an overrunning load. The valve meters oil out so the boom cannot run away when swinging logs off a trailer.',n:'Pilot ratios commonly about 3:1 to 8:1'},
    {m:'Hydraulic winches',t:'Motor counterbalance',d:'On winches and other motor drives with overrunning loads, the valve stops the load from driving the motor faster than the pump supplies oil.',n:'Set above the highest holding pressure'}],
  disc:'A farm telehandler boom creeps down when parked with a bale on the forks. List the parts of the circuit you would check, in order.',
  calc:{inputs:[['W','Load weight W','F',18000],['D','Bore D','len',0.08],['d','Rod diameter d','len',0.04],['f','Setting factor','n',1.3],['R','Pilot ratio (external pilot)','n',3]],
    compute(v,H){const A=area(v.D),Aa=A-area(v.d),pL=v.W/A,ps=v.f*pL,pr=(ps*A-v.W)/Aa,pp=(ps-pL)/v.R;return [
      {label:'Cap-end area',eq:'A = π·D² / 4',sub:`π × ${H.n(v.D,'len')}² / 4`,res:H.r(A,'area')},
      {label:'Annulus area',eq:'A<sub>r</sub> = π·(D² − d²) / 4',sub:`π × (${H.n(v.D,'len')}² − ${H.n(v.d,'len')}²) / 4`,res:H.r(Aa,'area')},
      {label:'Load-induced pressure',eq:'p<sub>L</sub> = W / A',sub:`${H.n(v.W,'F')} / ${H.n(A,'area')}`,res:H.r(pL,'p')},
      {label:'Valve setting',eq:'p<sub>s</sub> = f·p<sub>L</sub>',sub:`${fmt(v.f,2)} × ${H.n(pL,'p')}`,res:H.r(ps,'p')},
      {label:'Rod-side pressure to lower',eq:'p<sub>r</sub> = (p<sub>s</sub>·A − W) / A<sub>r</sub>',sub:`(${H.n(ps,'p')} × ${H.n(A,'area')} − ${H.n(v.W,'F')}) / ${H.n(Aa,'area')}`,res:H.r(pr,'p')},
      {label:'Pilot pressure, external pilot',eq:'p<sub>pilot</sub> = (p<sub>s</sub> − p<sub>L</sub>) / R',sub:`(${H.n(ps,'p')} − ${H.n(pL,'p')}) / ${fmt(v.R,1)}`,res:H.r(pp,'p')}];}},
  quiz:[
    {q:'What is the main purpose of a counterbalance valve?',o:['Stop an overrunning load from falling and lower it under control','Limit pump pressure','Run two cylinders in order','Reduce pressure to a branch'],a:0,why:'It keeps back pressure on the load side so the load cannot run away.'},
    {q:'A common rule of thumb for the counterbalance setting is…',o:['About 1.3 × the load-induced pressure','Equal to the load-induced pressure','Half the relief setting','Tank pressure'],a:0,why:'A 30% margin keeps the load from opening the valve on its own.'},
    {q:'A 27 kN (6,000 lbf) load sits on a 76 mm (3 in) bore cylinder. About what setting would you choose?',o:['About 76 bar (1,100 psi)','About 59 bar (849 psi)','About 45 bar (650 psi)','About 117 bar (1,700 psi)'],a:0,why:'p_L = 6,000 ÷ 7.07 ≈ 849 psi; × 1.3 ≈ 1,100 psi ≈ 76 bar.'},
    {q:'When raising the load, oil passes the counterbalance valve through…',o:['The bypass check valve','The spool after it opens','The internal drain','The pilot line'],a:0,why:'Flow into the cylinder lifts the check; the spool stays closed.'},
    {q:'Why is a counterbalance valve mounted right on the cylinder?',o:['So a burst hose cannot drop the load','To make adjustment easier','To lower its setting','To cool the oil'],a:0,why:'With no hose between valve and cylinder, a hose failure leaves the oil trapped.'}]},
reducing:{
  summary:'A pressure-reducing valve gives one branch a lower, steady pressure than the main system. It is normally open and closes down as its own outlet pressure reaches the setting.',
  points:['Below the setting, the valve is wide open and the outlet sees inlet pressure.','Outlet pressure, fed under the spool, pushes it up against the spring.','The spool edge throttles the inlet and holds the outlet at the setting.','The spring chamber must drain to tank.'],
  uses:'Transmission and PTO clutch supply on tractors, hydraulic row-unit downforce on planters, and pilot supply for joystick controls.',
  watch:'The pressure drop across the valve turns flow into heat. A blocked drain lets leakage build in the spring chamber and the setting creeps up.',
  apps:[
    {m:'Tractors',t:'Transmission, PTO clutch and brake supply',d:'Clutch packs and brake pistons need a moderate, steady pressure. A reducing valve takes oil from the main system and holds it at the right level whatever the implements are doing.',n:'Often about 14–20 bar (200–300 psi); check the service manual'},
    {m:'Planters',t:'Hydraulic row-unit downforce',d:'A reducing valve sets the pressure in the downforce cylinders on every row, so the operator or monitor can dial in down pressure for the soil while the tractor runs at full pressure.',n:'Force per row = pressure × bore area'},
    {m:'Loaders and combines',t:'Pilot supply for joysticks',d:'Joysticks and pilot-operated valves need a low, clean pilot pressure. A reducing valve supplies it from the main pump.',n:'Pilot supply about 20–35 bar (300–500 psi)'}],
  disc:'A planter uses hydraulic downforce on every row. How would you change the setting for wet versus dry soil, and what happens to tractor oil temperature?',
  calc:{inputs:[['pi','Inlet (system) pressure','p',1.4e7],['ps','Reduced setting','p',2.8e6],['D','Cylinder bore D','len',0.04],['n','Number of cylinders (rows)','n',16],['q','Flow through valve Q','Q',2.5e-4]],
    compute(v,H){const A=area(v.D),po=Math.min(v.pi,v.ps),F=po*A,P=Math.max(0,v.pi-po)*v.q;return [
      {label:'Outlet pressure',eq:'p<sub>o</sub> = min(p<sub>i</sub>, p<sub>s</sub>)',sub:`min(${H.n(v.pi,'p')}, ${H.n(v.ps,'p')})`,res:H.r(po,'p')},
      {label:'Bore area',eq:'A = π·D² / 4',sub:`π × ${H.n(v.D,'len')}² / 4`,res:H.r(A,'area')},
      {label:'Force per cylinder',eq:'F = p<sub>o</sub>·A',sub:`${H.n(po,'p')} × ${H.n(A,'area')}`,res:H.r(F,'F')},
      {label:'Total force',eq:'F<sub>t</sub> = n·F',sub:`${fmt(v.n,0)} × ${H.n(F,'F')}`,res:H.r(F*v.n,'F')},
      {label:'Power lost as heat',eq:'P = (p<sub>i</sub> − p<sub>o</sub>)·Q',sub:`(${H.n(v.pi,'p')} − ${H.n(po,'p')}) × ${H.n(v.q,'Q')}`,res:H.r(P,'pow')}];}},
  quiz:[
    {q:'In its resting state a pressure-reducing valve is…',o:['Normally open','Normally closed','Always half open','Vented to tank'],a:0,why:'It passes flow freely until outlet pressure reaches the setting.'},
    {q:'Which pressure does a reducing valve sense?',o:['Its outlet (downstream) pressure','Its inlet pressure','Tank pressure','A remote pilot pressure'],a:0,why:'Outlet pressure is fed under the spool and moves it against the spring.'},
    {q:'Why does a reducing valve need an external drain?',o:['Leakage into the spring chamber must go to tank or the setting creeps up','To raise inlet pressure','To open faster','It does not need one'],a:0,why:'Both ports are pressurized, so trapped leakage would add to the spring force.'},
    {q:'On a tractor, which circuit is a typical place for a reducing valve?',o:['Transmission or PTO clutch supply','Main pump relief','Loader float','Return filter bypass'],a:0,why:'Clutch packs need a steady, moderate pressure taken from the main system.'},
    {q:'A planter downforce cylinder has a 38 mm (1.5 in) bore at 28 bar (400 psi). About how much force does it apply?',o:['About 3.1 kN (707 lbf)','About 2.7 kN (600 lbf)','About 8.4 kN (1,885 lbf)','About 1.2 kN (267 lbf)'],a:0,why:'A = π × 1.5² ÷ 4 = 1.77 in²; 400 × 1.77 ≈ 707 lbf ≈ 3.1 kN.'}]},
unloading:{
  summary:'An unloading valve sends pump flow to tank at low pressure once a remote signal says the system is charged. Unlike a relief valve, it reacts to a pilot pressure taken from elsewhere in the circuit.',
  points:['While the remote pilot pressure is below the setting, the pump feeds the system.','When the pilot pressure reaches the setting, the spool lifts and the pump dumps to tank.','Pump pressure falls to a low value, saving power and heat.','A check valve keeps the system or accumulator charged while the pump idles.'],
  uses:'Hi-lo (two-stage) pumps on log splitters, accumulator charging on tractors and harvesters, and PTO hydraulic power packs.',
  watch:'Without enough difference between the unload and reload pressures, the pump cycles rapidly. A leaking check valve drains the accumulator back through the open valve.',
  apps:[
    {m:'Log splitters and wood processors',t:'Hi-lo (two-stage) pumps',d:'A large low-pressure section and a small high-pressure section work together. When splitting pressure rises, the large section unloads to tank, so the engine can make high pressure with less power and the ram still moves fast.',n:'Kick-down often about 35–50 bar (500–750 psi)'},
    {m:'Tractors and harvesters',t:'Accumulator charging',d:'In circuits with an accumulator, such as brake or suspension supply, the pump charges the accumulator and then unloads. The check valve keeps the system charged while the pump idles.',n:'Unload and reload pressures set apart'},
    {m:'PTO hydraulic power packs',t:'Fixed-pump power units',d:'PTO-driven power units with fixed pumps unload between work strokes, reducing heat and fuel use.',n:'Unloaded pressure about 3–10 bar (50–150 psi)'}],
  disc:'Compare a log splitter with and without a two-stage pump. How do cycle time and engine load change?',
  calc:{inputs:[['ps','System pressure','p',1.4e7],['pu','Unloaded pressure','p',7e5],['q','Pump flow Q','Q',6.33e-4],['t','Time the pump is unloaded (%)','n',70]],
    compute(v,H){const PL=v.ps*v.q,PU=v.pu*v.q,t=clamp(v.t/100),withU=(1-t)*PL+t*PU;return [
      {label:'Power at system pressure',eq:'P<sub>s</sub> = p<sub>s</sub>·Q',sub:`${H.n(v.ps,'p')} × ${H.n(v.q,'Q')}`,res:H.r(PL,'pow')},
      {label:'Power while unloaded',eq:'P<sub>u</sub> = p<sub>u</sub>·Q',sub:`${H.n(v.pu,'p')} × ${H.n(v.q,'Q')}`,res:H.r(PU,'pow')},
      {label:'Average, dumping over a relief',eq:'P̄ = P<sub>s</sub>',sub:`${H.n(PL,'pow')}`,res:H.r(PL,'pow')},
      {label:'Average, with unloading',eq:'P̄ = (1 − t)·P<sub>s</sub> + t·P<sub>u</sub>',sub:`${fmt(1-t,2)} × ${H.n(PL,'pow')} + ${fmt(t,2)} × ${H.n(PU,'pow')}`,res:H.r(withU,'pow')},
      {label:'Average saving',eq:'ΔP = P<sub>s</sub> − P̄',sub:`${H.n(PL,'pow')} − ${H.n(withU,'pow')}`,res:H.r(PL-withU,'pow')}];}},
  quiz:[
    {q:'What signal opens an unloading valve?',o:['A remote pilot pressure from elsewhere in the circuit','Its own inlet pressure','Its outlet pressure','The spring alone'],a:0,why:'That is the difference from a relief valve, which reacts to its own inlet.'},
    {q:'When the valve unloads, pump outlet pressure…',o:['Drops to a low value','Rises to the relief setting','Stays at system pressure','Goes negative'],a:0,why:'Pump flow goes to tank through a wide-open path.'},
    {q:'In a log splitter with a two-stage pump, the unloading valve…',o:['Dumps the large low-pressure section when splitting pressure rises','Raises the relief setting','Slows the return stroke','Stops the engine'],a:0,why:'Only the small high-pressure section works against the log, cutting power demand.'},
    {q:'A 38 L/min (10 gpm) pump would otherwise sit at 138 bar (2,000 psi); unloaded it runs at 7 bar (100 psi). About how much power does unloading save?',o:['About 8.3 kW (11.1 hp)','About 0.9 kW (1.2 hp)','About 4.3 kW (5.8 hp)','About 15 kW (20 hp)'],a:0,why:'(2,000 − 100) × 10 ÷ 1,714 ≈ 11.1 hp ≈ 8.3 kW.'},
    {q:'Why is a check valve placed after the unloading valve in an accumulator circuit?',o:['So the accumulator stays charged while the pump unloads','To raise pump flow','To cool the oil','To make the valve normally open'],a:0,why:'Without it, accumulator oil would run back to tank through the open valve.'}]},
'pilot-relief':{
  summary:'A pilot-operated relief uses a small pilot valve to control a large main spool. Pressure is balanced across the main spool until the pilot dart opens; then a small pressure drop lifts the spool and dumps pump flow to tank.',
  points:['Fluid from the pump enters the inlet port.','It passes through the orifice and fills the chamber above the main spool and the pilot chamber.','Equal pressure above the spool plus the biasing spring keep the spool closed.','At the setting, pilot pressure pushes the dart off its seat.','Pilot fluid drains to the reservoir past the open dart.','The orifice can’t keep up, pressure above the spool drops and the spool lifts.','Excess pump flow passes the main spool to the reservoir, holding pressure near the setting.'],
  uses:'Main relief on high-flow tractor and combine hydraulics, remote venting to unload PTO pumps, and two-pressure implement circuits.',
  watch:'A blocked orifice keeps the spool from opening properly, and a dirty dart seat makes pressure drift. Check the vent line for leaks if pressure will not build.',
  apps:[
    {m:'High-flow tractors and combines',t:'Main system relief',d:'Header-lift and unloading-auger circuits move a lot of oil. A pilot-operated relief keeps pressure close to the setting across the whole flow range, with a compact spring.',n:'Settings often 175–210 bar (2,500–3,000 psi) or more'},
    {m:'PTO hydraulic pumps',t:'Remote venting to unload',d:'Connecting the vent port to tank through a small solenoid valve drops the relief to a low pressure and unloads the pump while the operator is idle.',n:'Vented pressure about 3–10 bar (50–150 psi)'},
    {m:'Two-pressure implements',t:'Remote pressure selection',d:'A small remote relief on the vent line gives a second, lower setting, for example a gentle mode for a reel or a header float function.',n:'Remote setting below the main setting'}],
  disc:'Why would a large combine use a pilot-operated relief instead of a direct-acting one? Use spring size and pressure override in your answer.',
  calc:{inputs:[['fp','Pilot spring force','F',75],['dp','Dart seat diameter','len',0.0024],['fb','Biasing spring force','F',65],['ds','Main spool diameter','len',0.019],['q','Pump flow Q','Q',1.833e-3]],
    compute(v,H){const Ap=area(v.dp),pp=v.fp/Ap,As=area(v.ds),db=v.fb/As,pf=pp+db;return [
      {label:'Dart seat area',eq:'A<sub>d</sub> = π·d<sub>d</sub>² / 4',sub:`π × ${H.n(v.dp,'len')}² / 4`,res:H.r(Ap,'area')},
      {label:'Pilot setting',eq:'p<sub>p</sub> = F<sub>p</sub> / A<sub>d</sub>',sub:`${H.n(v.fp,'F')} / ${H.n(Ap,'area')}`,res:H.r(pp,'p')},
      {label:'Extra pressure to lift spool',eq:'Δp = F<sub>b</sub> / A<sub>s</sub>',sub:`${H.n(v.fb,'F')} / ${H.n(As,'area')}`,res:H.r(db,'p')},
      {label:'Full-flow pressure',eq:'p<sub>f</sub> = p<sub>p</sub> + Δp',sub:`${H.n(pp,'p')} + ${H.n(db,'p')}`,res:`${H.r(pf,'p')} (override ${fmt(db/pp*100,1)}%)`},
      {label:'Heat when relieving',eq:'P = p<sub>f</sub>·Q',sub:`${H.n(pf,'p')} × ${H.n(v.q,'Q')}`,res:H.r(pf*v.q,'pow')}];}},
  quiz:[
    {q:'What is the main advantage of a pilot-operated relief valve?',o:['Very little pressure override at high flow','Faster response than any other valve','No tank line needed','No spring needed'],a:0,why:'The light biasing spring only has to beat a small pressure difference.'},
    {q:'What does the orifice in the main spool do?',o:['Creates a pressure drop when pilot flow starts, unbalancing the spool','Limits pump flow','Filters the oil','Sets the relief pressure'],a:0,why:'With no flow, pressure is equal on both sides; pilot flow through the orifice drops the chamber pressure.'},
    {q:'Connecting the vent port to tank will…',o:['Unload the pump at low pressure','Raise the relief setting','Lock the main spool shut','Reverse the flow'],a:0,why:'With the chamber vented, only the biasing spring holds the spool.'},
    {q:'Why can the main biasing spring be so light?',o:['Pressure above and below the spool is nearly balanced','The spool is very small','Oil is incompressible','The dart pushes the spool directly'],a:0,why:'It only has to hold the spool against a small imbalance.'},
    {q:'Which machine is most likely to use a pilot-operated main relief?',o:['A high-flow combine hydraulic system','A sprayer nozzle body','A hand jack','A garden hose'],a:0,why:'High flow and tight pressure control suit the pilot-operated design.'}]}
};
/* randomized calculation problems for the course quiz, in the chosen units */
const pick=a=>a[Math.floor(Math.random()*a.length)];
function mkq(q,correct,dists,kind,why){const seen=new Set(),o=[];[correct,...dists].forEach(x=>{const s=H.e(x,kind);if(isFinite(x)&&x>0&&!seen.has(s)){seen.add(s);o.push(s);}});let m=1.6;while(o.length<4){const s=H.e(correct*m,kind);if(!seen.has(s)){seen.add(s);o.push(s);}m+=0.45;}return {q,o:o.slice(0,4),a:0,why};}

/* ---------- quiz ---------- */
function renderQuiz(box,makeQs,key,title){
  let qs,ans,right;
  function build(){qs=makeQs();ans=0;right=0;const best=store.get('best:'+key);
    box.innerHTML=`<div class="qhead"><h3>${title}</h3><p class="qmeta">${qs.length} questions${best!=null?`. Best so far: ${best} of ${qs.length}`:''}</p></div>`+
      qs.map((q,i)=>`<div class="qq" data-i="${i}"><p class="qt"><b>${i+1}.</b>${q.q}</p><div class="opts">${shuffle(q.o.map((t,j)=>j)).map(j=>`<button class="opt" data-j="${j}">${q.o[j]}</button>`).join('')}</div><p class="why" hidden></p></div>`).join('')+
      `<div class="qfoot"><p class="qres" aria-live="polite">Pick an answer for each question.</p><button class="btn" data-ui="retake">${key==='exam'?'New questions':'Start again'}</button></div>`;
    box.querySelectorAll('.qq').forEach(el=>{const q=qs[+el.dataset.i];el.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      if(el.classList.contains('done'))return;el.classList.add('done');const ok=+b.dataset.j===q.a;ans++;if(ok)right++;
      el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a)x.classList.add('ok');});if(!ok)b.classList.add('no');
      const w=el.querySelector('.why');w.hidden=false;w.innerHTML=`<b>${ok?'Correct.':'Not quite.'}</b> ${q.why}`;
      const res=box.querySelector('.qres');
      if(ans===qs.length){const prev=store.get('best:'+key);if(prev==null||right>prev)store.set('best:'+key,right);const pct=Math.round(right/qs.length*100);res.innerHTML=`<b>${right} of ${qs.length} correct (${pct}%).</b> ${pct>=80?'Well done.':pct>=60?'Good. Read the explanations above.':'Watch the animation again and check the calculator, then try once more.'}`;}
      else res.textContent=`${right} of ${ans} correct so far, ${qs.length-ans} to go.`;}));});
    box.querySelector('[data-ui=retake]').addEventListener('click',()=>{build();box.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});});}
  build();
}

  const vals=calcVals[key]||(calcVals[key]=Object.fromEntries(cd.inputs.map(([id,,,d])=>[id,d])));
  box.querySelector('.calcgrid').innerHTML=cd.inputs.map(([id,label,kind])=>`<label>${label}<span class="in"><input type="number" step="any" data-ci="${id}" data-kind="${kind}"><span class="u" data-cu="${id}"></span></span></label>`).join('');
  const out=box.querySelector('tbody');
  function sync(){box.querySelectorAll('[data-ci]').forEach(i=>{const E=EVERY[units][i.dataset.kind];i.value=+(vals[i.dataset.ci]*E[1]).toFixed(Math.max(E[2],2));box.querySelector(`[data-cu="${i.dataset.ci}"]`).textContent=E[0];});}
  function calc(){out.innerHTML=cd.compute(vals,H).map(r=>`<tr><td>${r.label}</td><td class="eq">${r.eq}</td><td class="sub">${r.sub}</td><td class="res">${r.res}</td></tr>`).join('');
    box.querySelector('.note').textContent=units==='us'?'Consistent US units in the substitutions: lbf, inches, seconds (psi, in², in³/s, in·lbf/s). Results are also shown in everyday units. Ideal model: friction, flow forces and leakage are ignored.':'Consistent SI units in the substitutions: newtons, metres, seconds (Pa, m², m³/s, W). Results are also shown in everyday units. Ideal model: friction, flow forces and leakage are ignored.';}
  box.querySelectorAll('[data-ci]').forEach(i=>i.addEventListener('change',()=>{const x=parseFloat(i.value);if(isFinite(x)&&x>=0)vals[i.dataset.ci]=x/EVERY[units][i.dataset.kind][1];sync();calc();}));
  box.querySelector('[data-ui=reset]').addEventListener('click',()=>{cd.inputs.forEach(([id,,,d])=>vals[id]=d);sync();calc();});
  sync();calc();
  return ()=>{sync();calc();};
}

    if(r.k!==lk){badge.dataset.k=r.k;lk=r.k;}
    if(r.cap!==lc){capEl.textContent=r.cap;lc=r.cap;}
    if(live){const kk=(r.on||[]).join();if(kk!==lo){lo=kk;kps.forEach(li=>li.classList.toggle('on',(r.on||[]).includes(+li.dataset.step)));}}
  }};
  cur.tick(0.016);
  syncPresenter();
}

/* ---------- units ---------- */
document.querySelectorAll('[data-units]').forEach(b=>b.addEventListener('click',()=>{units=b.dataset.units;
  document.querySelectorAll('[data-units]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  if(curKey==='exam')renderExam();else{calcRefresh&&calcRefresh();cur&&cur.unitText();}}));

/* ---------- lecture mode ---------- */
let lecture=false;
const lectBtn=$('lectureBtn'),pres=document.querySelector('.presenter');
function setLecture(on){lecture=on;document.body.classList.toggle('lecture',on);lectBtn.setAttribute('aria-pressed',String(on));if(cur&&cur.resetPoints)cur.resetPoints(!on);syncPresenter();if(on)window.scrollTo({top:0});}
lectBtn.addEventListener('click',()=>setLecture(!lecture));
const order=V.map(v=>v.key).concat('exam');
function step(d){const i=order.indexOf(curKey);go(order[(i+d+order.length)%order.length]);}
function fullscreen(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}catch(e){}}
pres.querySelector('[data-p-act=prev]').addEventListener('click',()=>step(-1));
pres.querySelector('[data-p-act=next]').addEventListener('click',()=>step(1));
pres.querySelector('[data-p-act=pt]').addEventListener('click',()=>cur&&cur.nextPoint&&cur.nextPoint());
pres.querySelector('[data-p-act=fs]').addEventListener('click',fullscreen);
pres.querySelector('[data-p-act=exit]').addEventListener('click',()=>setLecture(false));
function syncPresenter(){const v=V.find(x=>x.key===curKey);pres.querySelector('.pname').textContent=v?v.name:'Course quiz';}
document.addEventListener('keydown',e=>{
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'))return;if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(k==='ArrowRight'&&lecture){step(1);e.preventDefault();}
  else if(k==='ArrowLeft'&&lecture){step(-1);e.preventDefault();}
  else if(k===' '&&cur&&t.tagName!=='BUTTON'){cur.toggleAuto();e.preventDefault();}
  else if(k==='s'||k==='S'){cur&&cur.toggleSlow();}
  else if(k==='n'||k==='N'){cur&&cur.nextPoint();}
  else if(k==='l'||k==='L'){setLecture(!lecture);}
  else if(k==='f'||k==='F'){fullscreen();}
  else if(k==='Escape'&&lecture){setLecture(false);}
});
let last=0;
function loop(ts){const dt=last?Math.min(0.05,(ts-last)/1000):0.016;last=ts;if(cur)cur.tick(dt);requestAnimationFrame(loop);}
window.addEventListener('hashchange',()=>select(location.hash.slice(1)));
select(location.hash.slice(1)||'check');
requestAnimationFrame(loop);
})();
</script>
